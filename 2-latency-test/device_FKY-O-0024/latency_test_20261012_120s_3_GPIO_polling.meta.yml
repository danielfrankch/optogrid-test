# Test 2 (latency), FKY-O-0024, GPIO polling: recording configuration
# ASSUMED: scope and stimulus settings as for the GPIO interrupt recording (meta.yml); confirm
date: 2026-10-12
setup_script: ../og_latency_setup.m   # programs the stimulus, then ends

device:
  name: FKY-O-0024
  bridge: tcp://172.24.156.77:5555

sensor:
  ch1: optical sensor looking at LED 1 (light output, not current)

recording:
  instrument: "Digilent Analog Discovery Studio, WaveForms Scope (Mode: Record)"
  file: latency_test_20261012_120s_3_GPIO_polling.bin
  trigger_mode: GPIO polling      # from the file name
  type: Binary File (*.bin)
  format: 16 bit signed         # little-endian int16, no header
  channels: 2                   # interleaved samples [C1 C2]
  digital: false
  sample_rate_Hz: 200000        # WaveForms setting 200 kHz
  total_time_s: 120
  samples_per_channel: 24000000 # 24 M planned
  file_bytes: 95705088          # 23926272 samples per channel, 119.63 s
  start: trigger T0
  waveforms_conversion: Volts = Range * Sample / 65536 + Offset
  ch1_signal: optical sensor output on LED 1
  ch1_type: optical             # optical (V) or current (shunt voltage, mA)
  ch1_range_V_per_div: 1        # 1 V/div (50 V hardware full scale)
  ch1_offset_V: 0
  ch2_signal: trigger pulse from the function generator
  ch2_range_V_per_div: 1        # 1 V/div (50 V hardware full scale)
  ch2_offset_V: 0

stimulation:                    # og.OptoSetting programmed by og_latency_setup.m
  sequence_length: 1
  led_selection: 1              # LED 1 only
  period_ms: 6
  pulse_width_ms: 7
  duration_ms: 5                # one ~5.2 ms flash per trigger (measured on CH1)
  ramp_up_ms: 0
  ramp_down_ms: 0
  amplitude: 100
  pwm_frequency_Hz: 50000

trigger:                        # function generator pulse (CH2); each pulse sends a Bluetooth trigger command to the device
  period_ms: 99.9              # measured on CH2
  recorded_pulses: 1197        # measured on CH2
  pulse_width_ms: 1             # measured on CH1
  amplitude_V: 3            # measured on CH1
  symmetry_%: 2             # measured on CH1


notes: "GPIO polling mode."
