# Test 4, WPT coil: Rx resonance of the LRV-O-0001 Coil PCBA (Rx coil + tuning capacitor) by the dip method
# (WaveForms Network Analyzer, CSV export). Wavegen W1 -> 100 ohm -> sniffer loop -> GND. Ch1 = W1 (drive
# side of the resistor), Ch2 = across the sniffer loop; Ch2 magnitude / phase are relative to Ch1
# ("Relative: yes" in the CSV header). Read by analysis/analyse_network_analyzer.m.
date: 2026-10-24
device: LRV-O-0001
series_resistor_ohm: 100
sniffer_coil: 3 turns, 1 cm diameter, taped to the outer casing of the Coil PCBA; coaxial, 1 mm from the Rx coil (casing thickness)
setup: same set-up as test_1, not moved; linear sweep over the dip
rx_load: LRV-O-0001 attached
rx_loaded: true
tuning_capacitor_pF: 43
tuning_capacitor: "43 pF NP0 50 V"
sweep: 13.5-14.5 MHz, 2001 steps, linear (500 Hz)
baseline_rec: network_analyzer_3turn_sniffer_24_10_2026_test_1   # sweep lies inside the resonance: baselines from test 1
fit_lo_Hz: 13.5e6
fit_hi_Hz: 14.5e6
smooth_Hz: 120e3
