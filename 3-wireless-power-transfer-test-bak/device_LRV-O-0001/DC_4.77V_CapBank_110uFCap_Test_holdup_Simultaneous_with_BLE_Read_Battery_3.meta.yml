# Test 3, cap bank hold-up on DC: bank and device powered from a 4.77 V DC supply,
# the supply pins pulled by hand mid-recording. 110 uF nominal added on V_BANK
# (5 x Murata GRM155R60J226ME11). The scope measures the voltage across the
# capacitor bank. Recorded at the same time as wpt_holdup_20261014_181228.mat
# (og_wpt_test_4.m, BLE battery reads at 1 Hz).
date: 2026-10-14
supply_V: 4.77
added_capacitor: 5 x GRM155R60J226ME11 (110 uF nominal)
ble_log: wpt_holdup_20261014_181228.mat

recording:
  instrument: "Digilent Analog Discovery Studio, WaveForms Scope (Mode: Record)"
  file: DC_4.77V_CapBank_110uFCap_Test_holdup_Simultaneous_with_BLE_Read_Battery_3.bin
  format: 16 bit signed         # little-endian int16, no header
  channels: [1]
  sample_rate_Hz: 200000        # CHECK: assumed as the other cap bank recordings (18e6 samples = 90 s)
  waveforms_conversion: Volts = Range * Sample / 65536 - Offset   # see CLAUDE.md for the sign
  channel_range_V_per_div: 1
  channel_range_V: 61.6186365983      # C1 Range reported by WaveForms (1 V/div, as DC_5.0V_CapBank_Test_1)
  channel_offset_V: -2.001855472393   # -2 V offset; value as reported for DC_5.0V_CapBank_Test_1
  probe: across the capacitor bank
